# SPDX-License-Identifier: Apache-2.0
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: SPDX, layering, pin literals and driver includes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run repository checks
        run: bash scripts/check_sources.sh
      - name: Verify the checks themselves
        run: |
          bash scripts/tests/test_pin_literal_check.sh
          bash scripts/tests/test_driver_include_check.sh

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          find ports core drivers platform apps tests \
               \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \) \
               -not -path '*/third_party/*' -not -path '*/vendor/*' \
               -print0 2>/dev/null \
            | xargs -0 --no-run-if-empty clang-format --dry-run --Werror

  build:
    name: host build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # libmosquitto and the mosquitto broker: the simulator's --broker, the
      # port_telemetry contract against libmosquitto and a real broker, and
      # tests/cli/simulator_broker.py -- each test starts a private broker on
      # a free port, whatever the package's own service does (ADR 0030,
      # amendment "The simulator on a real broker").
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libmosquitto-dev mosquitto
      - run: cmake --preset ci-headless
      - run: cmake --build build/host-debug
      - run: ctest --test-dir build/host-debug --output-on-failure

  asan:
    name: host build and tests (ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same, so that the MQTT client's threads and copies run under the
      # sanitizers too.
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libmosquitto-dev mosquitto
      - run: cmake --preset host-asan
      - run: cmake --build build/host-asan
      - run: ctest --test-dir build/host-asan --output-on-failure
