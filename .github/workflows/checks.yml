# SPDX-License-Identifier: Apache-2.0
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: SPDX, layering and pin literals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run repository checks
        run: bash scripts/check_sources.sh
      - name: Verify the checks themselves
        run: bash scripts/tests/test_pin_literal_check.sh

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          find ports core drivers platform apps tests \
               \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \) \
               -not -path '*/third_party/*' -not -path '*/vendor/*' \
               -print0 2>/dev/null \
            | xargs -0 --no-run-if-empty clang-format --dry-run --Werror

  build:
    name: host build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - run: cmake --preset ci-headless
      - run: cmake --build build/host-debug
      - run: ctest --test-dir build/host-debug --output-on-failure

  asan:
    name: host build and tests (ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - run: cmake --preset host-asan
      - run: cmake --build build/host-asan
      - run: ctest --test-dir build/host-asan --output-on-failure
